task: phybench
dataset_path: Eureka-Lab/PHYBench
output_type: generate_until
test_split: train
process_docs: !function utils.process_docs
doc_to_text: "Problem: {{content}}\n\nGive a detailed derivation and put the single final symbolic expression in \\boxed{}.\nSolution:"
doc_to_target: "{{answer}}"
process_results: !function utils.process_results
generation_kwargs:
  until:
    - "</s>"
    - "<|im_end|>"
    - "<|eot_id|>"
  do_sample: false
  temperature: 0.0
  max_gen_toks: 32768
metric_list:
  - metric: exact_match
    aggregation: mean
    higher_is_better: true
  - metric: math_verify
    aggregation: mean
    higher_is_better: true
num_fewshot: 0
metadata:
  version: 1.0
