dataset_path: ScaleAI/MultiNRC
output_type: generate_until
test_split: test
doc_to_text: !function utils.doc_to_text
doc_to_target: "{{i18n_gtfa}}"
process_results: !function utils.process_results
generation_kwargs:
  until:
    - "</s>"
    - "<|im_end|>"
    - "<|eot_id|>"
  do_sample: false
  temperature: 0.0
  max_gen_toks: 32768
metric_list:
  - metric: acc
    aggregation: mean
    higher_is_better: true
num_fewshot: 0
metadata:
  version: 1.0
