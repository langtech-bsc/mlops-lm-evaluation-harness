tag:
  - math_word_problems
output_type: generate_until
test_split: train
doc_to_text: "Problem: {{problem}}\n\nGive a detailed justification and put the final answer in \\boxed{}.\nSolution:"
doc_to_target: "{{answer}}"
process_results: !function utils.process_results
generation_kwargs:
  until:
    - "</s>"
    - "<|im_end|>"
    - "<|eot_id|>"
  do_sample: false
  temperature: 0.0
  max_gen_toks: 32768
metric_list:
  - metric: acc
    aggregation: mean
    higher_is_better: true
  - metric: exact_match
    aggregation: mean
    higher_is_better: true
  - metric: math_verify
    aggregation: mean
    higher_is_better: true
num_fewshot: 0
metadata:
  version: 1.0
